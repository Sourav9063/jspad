  <script>
    const CDN_BASE_URL = "https://cdn.jsdelivr.net/npm/";
    // Pinned CDN files checked against SHA-256 digests before use. Changing a version means recomputing its digest.
    const VERIFIED_ASSETS = {
      brotliGlue: {
        url: `${CDN_BASE_URL}brotli-wasm@3.0.1/pkg.web/brotli_wasm.js`,
        sha256: "cd7c6ad22230d9ad5618f4bc5b1a032677a18bcc9c7abecba6d5439beff031bc",
      },
      brotliWasm: {
        url: `${CDN_BASE_URL}brotli-wasm@3.0.1/pkg.web/brotli_wasm_bg.wasm`,
        sha256: "9ef0a025046bf7d87b7cdb8eac3f73a5c8fea2f1adb848cc9768345573fcd8a9",
      },
      marked: {
        url: `${CDN_BASE_URL}marked@18.0.14/lib/marked.esm.js`,
        sha256: "528a1b88bef88fc27277e06036ce7f4afb6a220b18110ba57c09e292b24a7ce0",
      },
      domPurify: {
        url: `${CDN_BASE_URL}dompurify@3.4.16/dist/purify.es.mjs`,
        sha256: "c44274a7959cfdd4da871fa78a5d5fbbef55db68d118c5c0833bc4b5cf9633ad",
      },
      githubMarkdownCss: {
        url: `${CDN_BASE_URL}github-markdown-css@5.9.0/github-markdown-dark.css`,
        sha256: "b45ead2db01f5856c4eb378f21f47da63f6b0ecf3be5d06385472164b7283df6",
      },
    };
    const ASSET_TIMEOUT_MS = 20_000;

    const SHARE_FORMAT_VERSION = "1";
    const SHARE_HASH_PATTERN = /^(\d+)\.([A-Za-z0-9_-]+)$/;
    const SHARE_MODES = [ "js", "ts", "md" ];
    const BROTLI_QUALITY = 11;
    const MAX_SHARE_HASH_LENGTH = 1_000_000;
    // Caps decompressed output so a tiny crafted link can't expand into gigabytes.
    const MAX_SHARE_PAYLOAD_BYTES = 4 * 1024 * 1024;
    const DECOMPRESS_CHUNK_BYTES = 64 * 1024;
    const BASE64_CHUNK_BYTES = 0x8000;

    class ShareLinkError extends Error {
      constructor(code, message, options) {
        super(message, options);
        this.name = "ShareLinkError";
        this.code = code;
      }
    }

    const damagedLinkError = (cause) =>
      new ShareLinkError("damaged", "This link is damaged or incomplete, so it couldn't be opened.", { cause });

    function toHex(buffer) {
      return Array.from(new Uint8Array(buffer), (byte) => byte.toString(16).padStart(2, "0")).join("");
    }

    async function fetchVerified({ url, sha256 }) {
      const response = await fetch(url, { credentials: "omit", signal: AbortSignal.timeout(ASSET_TIMEOUT_MS) });
      if (!response.ok) throw new Error(`${url} returned HTTP ${response.status}`);
      const bytes = await response.arrayBuffer();
      const digest = toHex(await crypto.subtle.digest("SHA-256", bytes));
      if (digest !== sha256) throw new Error(`${url} failed its integrity check`);
      return bytes;
    }

    // Dynamic import() can't carry an integrity attribute, so verify the bytes first and import them from a blob.
    async function importVerified(asset) {
      const bytes = await fetchVerified(asset);
      const blobUrl = URL.createObjectURL(new Blob([ bytes ], { type: "text/javascript" }));
      try {
        return await import(blobUrl);
      } finally {
        URL.revokeObjectURL(blobUrl);
      }
    }

    let brotliPromise = null;

    function loadBrotli() {
      brotliPromise ??= initBrotli().catch((cause) => {
        brotliPromise = null;
        throw new ShareLinkError("load-failed", "Couldn't load the share-link compressor. Check your connection and try again.", { cause });
      });
      return brotliPromise;
    }

    async function initBrotli() {
      const [ brotli, wasmBytes ] = await Promise.all([
        importVerified(VERIFIED_ASSETS.brotliGlue),
        fetchVerified(VERIFIED_ASSETS.brotliWasm),
      ]);
      await brotli.default(wasmBytes);
      return brotli;
    }

    function bytesToBase64Url(bytes) {
      let binary = "";
      for (let i = 0; i < bytes.length; i += BASE64_CHUNK_BYTES) {
        binary += String.fromCharCode(...bytes.subarray(i, i + BASE64_CHUNK_BYTES));
      }
      return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    function base64UrlToBytes(text) {
      const base64 = text.replace(/-/g, "+").replace(/_/g, "/");
      const padded = base64 + "=".repeat((4 - (base64.length % 4)) % 4);
      let binary;
      try {
        binary = atob(padded);
      } catch (cause) {
        throw damagedLinkError(cause);
      }
      return Uint8Array.from(binary, (char) => char.charCodeAt(0));
    }

    function concatBytes(chunks) {
      const result = new Uint8Array(chunks.reduce((total, chunk) => total + chunk.length, 0));
      let offset = 0;
      for (const chunk of chunks) {
        result.set(chunk, offset);
        offset += chunk.length;
      }
      return result;
    }

    function decompressBounded(brotli, input) {
      const { ResultSuccess, NeedsMoreOutput } = brotli.BrotliStreamResultCode;
      const stream = new brotli.DecompressStream();
      const chunks = [];
      let inputOffset = 0;
      try {
        for (;;) {
          const result = stream.decompress(input.subarray(inputOffset), DECOMPRESS_CHUNK_BYTES);
          const resultCode = result.code;
          chunks.push(result.buf);
          inputOffset += result.input_offset;
          result.free();
          if (stream.total_out() > MAX_SHARE_PAYLOAD_BYTES) {
            throw new ShareLinkError("too-large", "This link holds more code than JS Pad can open.");
          }
          if (resultCode === ResultSuccess) break;
          // NeedsMoreInput here means the link was cut off.
          if (resultCode !== NeedsMoreOutput) throw damagedLinkError();
        }
      } catch (error) {
        if (error instanceof ShareLinkError) throw error;
        throw damagedLinkError(error);
      } finally {
        stream.free();
      }
      if (inputOffset !== input.length) throw damagedLinkError();
      return concatBytes(chunks);
    }

    function parseSharePayload(text) {
      let value;
      try {
        value = JSON.parse(text);
      } catch (cause) {
        throw damagedLinkError(cause);
      }
      const isValid = typeof value === "object" && value !== null
        && typeof value.code === "string" && SHARE_MODES.includes(value.mode);
      if (!isValid) throw damagedLinkError();
      return { mode: value.mode, code: value.code };
    }

    async function encodeShareHash({ mode, code }) {
      const payload = new TextEncoder().encode(JSON.stringify({ mode, code }));
      const tooLarge = new ShareLinkError("too-large", "This code is too long to fit in a share link.");
      if (payload.length > MAX_SHARE_PAYLOAD_BYTES) throw tooLarge;
      const brotli = await loadBrotli();
      const hash = `${SHARE_FORMAT_VERSION}.${bytesToBase64Url(brotli.compress(payload, { quality: BROTLI_QUALITY }))}`;
      if (hash.length > MAX_SHARE_HASH_LENGTH) throw tooLarge;
      return hash;
    }

    async function decodeShareHash(hash) {
      if (hash.length > MAX_SHARE_HASH_LENGTH) {
        throw new ShareLinkError("too-large", "This link holds more code than JS Pad can open.");
      }
      const match = SHARE_HASH_PATTERN.exec(hash);
      if (!match) throw damagedLinkError();
      if (match[ 1 ] !== SHARE_FORMAT_VERSION) {
        throw new ShareLinkError("unsupported-version", "This link was made by a newer version of JS Pad. Reload the page and try again.");
      }
      const compressed = base64UrlToBytes(match[ 2 ]);
      const brotli = await loadBrotli();
      const bytes = decompressBounded(brotli, compressed);
      let text;
      try {
        text = new TextDecoder("utf-8", { fatal: true }).decode(bytes);
      } catch (cause) {
        throw damagedLinkError(cause);
      }
      return parseSharePayload(text);
    }
  </script>

function first<T>(arr: T[]): T | undefined {

        window.define = savedDefine;
        MonacoVim = window.MonacoVim;
        if (localStorage.getItem(VIM_KEY) === "1") setVimActive(true);
      };
      document.head.appendChild(vimScript);

      formatBtn.addEventListener("click", () => {
        editor.getAction("editor.action.formatDocument").run();
      });

      function flashCopied(btn) {
        const orig = btn.innerHTML;
        btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
        btn.classList.add("text-green-400");
        setTimeout(() => {
          btn.innerHTML = orig;
          btn.classList.remove("text-green-400");
        }, 1500);
      }

      document
        .getElementById("copy-editor-btn")
        .addEventListener("click", () => {
          navigator.clipboard
            .writeText(editor.getValue())
            .then(() =>
              flashCopied(document.getElementById("copy-editor-btn")),
            );
        });

      document
        .getElementById("copy-output-btn")
        .addEventListener("click", () => {
          navigator.clipboard
            .writeText((mode === "md" ? previewDiv : outputDiv).innerText)
            .then(() =>
              flashCopied(document.getElementById("copy-output-btn")),
            );
        });

      function renderOutput() {
        const code = editor.getValue();
        if (mode === "md") {
          renderPreview(code);
          return;
        }
        runCode(code);
      }

      // Source text of each rendered code block, for its copy button (highlighted HTML loses the newlines).
      const codeBlockSources = new WeakMap();
      // Highlighting is async, so re-renders on every keystroke reuse earlier results instead of flickering.
      const highlightCache = new Map();

      function renderPreview(markdown) {
        const fragment = renderMarkdown(markdown);
        for (const pre of fragment.querySelectorAll("pre")) decorateCodeBlock(pre);
        for (const marker of fragment.querySelectorAll("[data-task-checked]")) marker.replaceWith(createTaskCheckbox(marker));
        previewDiv.replaceChildren(fragment);
      }

      function createTaskCheckbox(marker) {
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.disabled = true;
        checkbox.checked = marker.dataset.taskChecked === "true";
        checkbox.className = "task-list-item-checkbox";
        marker.closest("li")?.classList.add("task-list-item");
        return checkbox;
      }

      function decorateCodeBlock(pre) {
        const wrapper = document.createElement("div");
        wrapper.className = "relative group";
        pre.replaceWith(wrapper);
        wrapper.append(pre, codeCopyTemplate.content.firstElementChild.cloneNode(true));
        const code = pre.querySelector("code") ?? pre;
        const source = code.textContent.replace(/\n$/, "");
        codeBlockSources.set(wrapper, source);
        const language = monacoLanguageFor(/\blanguage-(\S+)/.exec(code.className)?.[ 1 ]);
        if (language) highlightCodeBlock(code, source, language);
      }

      function monacoLanguageFor(name) {
        if (!name) return undefined;
        const wanted = name.toLowerCase();
        return monaco.languages.getLanguages().find((language) =>
          language.id === wanted
          || language.aliases?.some((alias) => alias.toLowerCase() === wanted)
          || language.extensions?.includes(`.${wanted}`),
        )?.id;
      }

      function highlightCodeBlock(code, source, language) {
        const cacheKey = `${language}\n${source}`;
        const cached = highlightCache.get(cacheKey);
        if (cached !== undefined) {
          code.innerHTML = cached;
          return;
        }
        monaco.editor.colorize(source, language, {}).then((lineHtml) => {
          // GitHub's stylesheet hides <br> inside code, so break lines with the <pre>'s own newlines.
          const html = lineHtml.replace(/<br\/>$/, "").replaceAll("<br/>", "\n");
          if (highlightCache.size >= MAX_HIGHLIGHT_CACHE_ENTRIES) highlightCache.clear();
          highlightCache.set(cacheKey, html);
          // Monaco escapes the source when it builds this HTML. The block may be gone after a newer render.
          if (code.isConnected) code.innerHTML = html;
        }, (error) => console.warn(`Couldn't highlight ${language} code:`, error));
      }

      previewDiv.addEventListener("click", (event) => {
        const button = event.target.closest("[data-copy-code]");
        if (!button) return;
        navigator.clipboard
          .writeText(codeBlockSources.get(button.parentElement))
          .then(() => flashCopied(button));
      });

      function runCode(code) {
        if (isPaused) return;
        outputDiv.innerHTML = "";

        function appendLine(text, colorClass) {
          if (outputDiv.firstChild) {
            const hr = document.createElement("hr");
            hr.className = "border-zinc-800 my-1";
            outputDiv.appendChild(hr);
          }
          const span = document.createElement("span");
          span.className = colorClass;
          span.textContent = text;
          outputDiv.appendChild(span);
        }

        function stringify(a) {
          if (a instanceof Error) return a.message;
          if (typeof a === "object" && a !== null)
            return JSON.stringify(a, null, 2);
          return String(a);
        }

        const customConsole = {
          log: (...args) =>
            appendLine(args.map(stringify).join(" "), "text-sky-300"),
          error: (...args) =>
            appendLine(
              "[error] " + args.map(stringify).join(" "),
              "text-red-400",
            ),
          warn: (...args) =>
            appendLine(
              "[warn] " + args.map(stringify).join(" "),
              "text-yellow-400",
            ),
        };

        try {
          const runnable = mode === "ts"
            ? ts.transpileModule(code, { compilerOptions: { target: ts.ScriptTarget.ES2020 } }).outputText
            : code;
          new Function("console", runnable)(customConsole);
        } catch (err) {
          appendLine(err.message, "text-red-400");
        }
      }

      editor.onDidChangeModelContent((event) => {
        if (isApplyingProgrammaticEdit) return;
        if (isPaused) {
          // Undo and redo re-apply text rather than type it, so they never count as consent to run.
          const isHistoryEdit = event.isUndoing || event.isRedoing || event.isFlush;
          if (!isHistoryEdit) setPaused(false);
          return;
        }
        persistCode();
        renderOutput();
        scheduleIdleDetection();
      });

      async function initialize() {
        try {
          await switchMode(readStoredMode());
        } catch (error) {
          showNotice(error.message);
        }
        await queueHashConsumption("load");
      }

      updateModeUi();
      renderOutput();
      addEventListener("hashchange", () => queueHashConsumption("hashchange"));
      initialize();
    });

    // Divider drag to resize
    const divider = document.getElementById("divider");
    const editorPanel = document.getElementById("editor-panel");

    function isMobile() { return window.innerWidth < 768; }

    function setInitialSize() {
      if (isMobile()) {
        editorPanel.style.width = "";
        editorPanel.style.height = "50%";
      } else {
        editorPanel.style.height = "";
        editorPanel.style.width = "60%";
      }
    }

    setInitialSize();
    window.addEventListener("resize", setInitialSize);

    function startDrag(getClientPos) {
      const mobile = isMobile();
      document.body.style.cursor = mobile ? "row-resize" : "col-resize";
      document.body.style.userSelect = "none";

      function onMove(e) {
        const pos = getClientPos(e);
        if (mobile) {
          const newHeight = Math.min(Math.max(pos.y, 100), document.body.clientHeight - 100);
          editorPanel.style.height = newHeight + "px";
        } else {
          const newWidth = Math.min(Math.max(pos.x, 150), document.body.clientWidth - 150);
          editorPanel.style.width = newWidth + "px";
        }
      }

      function onUp() {
        document.body.style.cursor = "";
        document.body.style.userSelect = "";
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onUp);
        document.removeEventListener("touchmove", onMove);
        document.removeEventListener("touchend", onUp);
      }

      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
      document.addEventListener("touchmove", onMove, { passive: false });
      document.addEventListener("touchend", onUp);
    }

    divider.addEventListener("mousedown", (e) => {
      e.preventDefault();
      startDrag((e) => ({ x: e.clientX, y: e.clientY }));
    });

    divider.addEventListener("touchstart", (e) => {
      e.preventDefault();
      startDrag((e) => ({ x: e.touches[ 0 ].clientX, y: e.touches[ 0 ].clientY }));
    }, { passive: false });
  </script>
</body>

</html>
